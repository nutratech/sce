# Serve a generated Matrix key response while the homeserver is offline.
# Replace the server name, certificate paths, and response file path.
server {
    listen 443 ssl;
    server_name matrix.example.org;

    ssl_certificate /etc/letsencrypt/live/matrix.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.example.org/privkey.pem;

    location = /_matrix/key/v2/server {
        default_type application/json;
        alias /var/lib/sce/matrix-key/server.json;
        add_header Cache-Control "public, max-age=3600";
    }

    # This host only serves the public key document.
    location / {
        return 404;
    }
}
